name: Fetch News Daily (Google News RSS) & Deploy to GitHub Pages

# Trigger sekali sehari pagi (06:00 UTC = 13:00 WIB)
# Push hasil commit ke main → trigger deploy.yml → build + deploy ke GitHub Pages
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:  # biar bisa manual run kalau mau test

permissions:
  contents: write  # butuh write untuk commit + push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Hanya std lib: urllib, xml.etree, json — nggak butuh pip install

      - name: Fetch berita dari Google News RSS
        run: python scripts/fetch_news.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json src/data/blog/*.md
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "chore: update berita & blog dari Google News RSS ($(date -u +%Y-%m-%d))"
          git push
          echo "Commit + push selesai. deploy.yml akan otomatis jalan (on: push ke main)."
