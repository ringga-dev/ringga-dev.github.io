name: Fetch News Daily (Google News RSS) & Deploy to GitHub Pages

# NONAKTIF. Pipeline ini menimpa konten terkurasi dengan stub 20-30 kata
# dari judul RSS saja (tanpa isi artikel), lalu content_gate.py memblokir
# deploy. Dimatikan atas permintaan pemilik ("gak mau di rutunin").
# Konten baru harus lewat alur content-pipeline: topik dulu, banyak sumber,
# tulis setelah data lengkap — bukan scripting judul RSS.

# Tidak ada cron: workflow ini hanya jalan kalau di-trigger manual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    # Dinonaktifkan total: job ini tidak akan pernah berjalan.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Hanya std lib: urllib, xml.etree, json — nggak butuh pip install

      - name: Fetch berita dari Google News RSS
        run: python scripts/fetch_news.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json src/data/blog/*.md
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "chore: update berita & blog dari Google News RSS ($(date -u +%Y-%m-%d))"
          git push
          echo "Commit + push selesai. deploy.yml akan otomatis jalan (on: push ke main)."
